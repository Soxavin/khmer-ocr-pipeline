[project]
name = "khmer-pipeline"
version = "0.1.0"
description = "Khmer document extraction pipeline"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "numpy>=1.26",
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
    "surya-ocr>=0.20.0,<0.21",
    "bleach>=6.0",
    "mlx>=0.31.2,<0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch>=2.12,<2.13",
    "transformers>=4.56.1,<5.0",
    "pytesseract>=0.3,<0.4",
    "pandas>=2.0,<4.0",
    "rapid-table>=3.0,<4.0",
    "openpyxl>=3.1,<4.0",
    "rapid-layout>=1.2.1,<2.0",
    "nicegui>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8,<4.0",
]
# Cloud-API deps kept out of the core local-first pipeline: openai (optional LLM
# judge in evaluation/, and gt_provenance) and google-genai (the Gemini engine) —
# both contradict the local-first stance, so neither is a core dependency.
# Installed by CI's `uv sync --all-extras`.
#
# playwright was dropped on this branch: its only consumer was the dataset
# factory's synthetic-document renderer, which lives on `main`, not here.
eval-extras = [
    "google-genai>=1.0,<2.0",
    "openai>=1.0,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/khmer_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
