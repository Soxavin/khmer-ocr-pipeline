name: Test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest -q --tb=short

      # Covers apps/ (api, web tooling, legacy Streamlit) and tools/ too — a
      # syntax error outside src/khmer_pipeline/ was previously caught only if
      # pytest happened to import the module.
      - name: Compile check
        run: python3 -m py_compile $(find src/khmer_pipeline apps tools -name "*.py")

  # The React workspace is the primary UI, but none of its checks ran in CI:
  # 181 vitest tests, the tsc -b typecheck and oxlint were all local-only, so a
  # broken frontend merged green. Runs in parallel with the python job.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"          # matches the Dockerfile's node:22-slim stage
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint             # oxlint

      - name: Typecheck + build
        run: npm run build            # tsc -b && vite build

      - name: Unit tests
        run: npm test                 # vitest run
